name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The LOC guard reads tokei's JSON and fails when the input is empty, so
      # a missing tokei fails the check rather than skipping it. Install it
      # rather than let the guard be the thing that never runs here.
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei

      # pack-check exercises install.ps1 as well as install.sh: the two are a
      # matched pair (SPEC.md §10.6), and claiming the PowerShell installer
      # works because the bash one does is the overclaim §7.5 forbids.
      - name: PowerShell is available for the Windows installer's tests
        run: pwsh --version

      - run: pnpm install --frozen-lockfile

      # One gate, the same one a developer runs: format, lint, typecheck, LOC,
      # tests, build, smoke, and the installed-artifact gate. Listing the steps
      # separately here is how CI and `pnpm check` drift apart.
      - run: pnpm check

      # Test the actual composite-action boundary, not only its Node entry point.
      - name: Stage an isolated setup-action fixture
        id: action-fixture
        run: |
          fixture="$RUNNER_TEMP/ds-skills-action"
          mkdir -p "$fixture/project"
          node scripts/release/stage.mjs --release v0.0.0-action-ci --out "$fixture/release"
          cp "$fixture/release/ds-skills.release.json" "$fixture/project/ds-skills.release.json"
          node scripts/checks/serve-release.mjs "$fixture/release" "$fixture/port" > "$fixture/server.log" 2>&1 &
          echo $! > "$fixture/pid"
          for attempt in $(seq 1 100); do test -s "$fixture/port" && break; sleep 0.1; done
          test -s "$fixture/port"
          echo "project=$fixture/project" >> "$GITHUB_OUTPUT"
          echo "mirror=http://127.0.0.1:$(cat "$fixture/port")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-ds-skills
        id: ds-setup
        with:
          project-directory: ${{ steps.action-fixture.outputs.project }}
          release-mirror: ${{ steps.action-fixture.outputs.mirror }}
      - name: Verify action-installed project
        run: node "$DS_SKILLS_LAUNCHER" --check
        env:
          DS_SKILLS_LAUNCHER: ${{ steps.ds-setup.outputs.launcher }}
          DS_SKILLS_PREFIX: ${{ steps.ds-setup.outputs.prefix }}
      - name: Stop isolated action fixture server
        if: always()
        run: |
          pidfile="$RUNNER_TEMP/ds-skills-action/pid"
          if test -f "$pidfile"; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
